name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v). Leave blank to auto-bump from Conventional Commits since the last tag."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-2.14.2" >> "$GITHUB_PATH"

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # feat -> minor, fix -> patch, a breaking-change commit -> major (cliff.toml's commit_parsers)
            RAW="$(git-cliff --config cliff.toml --bumped-version)" || {
              echo "::error::git-cliff could not compute a next version (no Conventional Commits since the last tag?)"
              exit 1
            }
            VERSION="${RAW#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bump crate version
        run: |
          sed -i '0,/^version = /{s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.toml
          sed -i '/^name = "wayfinder"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.lock

      - name: Generate changelog
        run: |
          # --prepend needs the file to exist; the first release starts it
          [ -f CHANGELOG.md ] || : > CHANGELOG.md
          git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --prepend CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"
          # the tag push above triggers release.yml, which builds and publishes it
