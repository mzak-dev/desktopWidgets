name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v). Leave blank to auto-bump from Conventional Commits since the last tag."
        required: false
        type: string
      velopack:
        description: "Build and publish the Setup.exe with Velopack. Off just bumps the version, changelog and tag."
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-2.14.2" >> "$GITHUB_PATH"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # feat -> minor, fix -> patch, a breaking-change commit -> major (cliff.toml's commit_parsers)
            RAW="$(git-cliff --config cliff.toml --bumped-version)" || {
              echo "::error::git-cliff could not compute a next version (no Conventional Commits since the last tag?)"
              exit 1
            }
            VERSION="${RAW#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump crate version
        run: |
          sed -i '0,/^version = /{s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.toml
          sed -i '/^name = "wayfinder"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.lock

      - name: Generate changelog
        run: |
          # --prepend needs the file to exist; the first release starts it
          [ -f CHANGELOG.md ] || : > CHANGELOG.md
          git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --prepend CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"
          # a bare tag push builds nothing by itself — see build-and-release below

  build-and-release:
    needs: prepare
    if: ${{ inputs.velopack }}
    runs-on: windows-latest
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --lib
      - name: Build
        run: cargo build --locked --release
      - name: Install vpk
        run: dotnet tool update -g vpk
      - name: Download previous release (delta base)
        # vpk pack diffs against whatever full package already sits in .\Releases; with
        # nothing there (the very first release) it just packs full-only, so this is best-effort.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN
      - name: Stage package contents
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/wayfinder.exe dist/
          Copy-Item -Recurse -Force assets/guides dist/guides
      - name: Pack (full + delta, if a previous release was found)
        run: vpk pack -u Wayfinder -v $env:APP_VERSION -p dist -e wayfinder.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --publish --tag $env:TAG
      - name: Set release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-pc-windows-msvc.zip -o cliff.zip
          Expand-Archive cliff.zip -DestinationPath $env:RUNNER_TEMP\git-cliff
          $cliffExe = (Get-ChildItem -Path $env:RUNNER_TEMP\git-cliff -Recurse -Filter git-cliff.exe | Select-Object -First 1).FullName
          & $cliffExe --config cliff.toml --tag $env:TAG --latest --strip header -o RELEASE_NOTES.md
          gh release edit $env:TAG --notes-file RELEASE_NOTES.md
