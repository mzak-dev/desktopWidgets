name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v, e.g. 1.4.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Bump crate version
        run: |
          sed -i '0,/^version = /{s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.toml
          sed -i '/^name = "wayfinder"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.lock

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-2.14.2" >> "$GITHUB_PATH"

      - name: Generate changelog and release notes
        run: |
          # the notes go straight to a file: commit titles with quotes or backticks never pass through the shell
          git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --strip header -o RELEASE_NOTES.md
          # --prepend needs the file to exist; the first release starts it
          [ -f CHANGELOG.md ] || : > CHANGELOG.md
          git-cliff --config cliff.toml --unreleased --tag "v$VERSION" --prepend CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"

  build-and-release:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --lib

      - name: Build
        run: cargo build --locked --release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" target/release/wayfinder.exe --title "Wayfinder v${{ inputs.version }}" --notes-file RELEASE_NOTES.md
