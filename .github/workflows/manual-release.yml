name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v, e.g. 1.4.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a valid semver (expected X.Y.Z)"
            exit 1
          fi
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Bump crate version
        run: |
          VERSION="${{ inputs.version }}"
          sed -i '0,/^version = /{s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.toml
          sed -i '/^name = "wayfinder"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/}' Cargo.lock

      - name: Ensure changelog file exists
        run: touch CHANGELOG.md

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ inputs.version }} --prepend CHANGELOG.md

      - name: Save release notes
        run: echo "${{ steps.cliff.outputs.content }}" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ inputs.version }}"

  build-and-release:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --lib

      - name: Build
        run: cargo build --locked --release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" target/release/wayfinder.exe --title "Wayfinder v${{ inputs.version }}" --notes-file RELEASE_NOTES.md
