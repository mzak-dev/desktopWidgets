name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.2.3). Normally run via Manual Release's velopack switch instead of directly."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --lib
      - name: Build
        run: cargo build --locked --release
      - name: Check tag matches Cargo.toml version
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
            Write-Error "Tag $env:TAG does not match Cargo.toml version $cargoVersion"
            exit 1
          }
          echo "APP_VERSION=$cargoVersion" >> $env:GITHUB_ENV
      - name: Install vpk
        run: dotnet tool update -g vpk
      - name: Download previous release (delta base)
        # vpk pack diffs against whatever full package already sits in .\Releases; with
        # nothing there (the very first release) it just packs full-only, so this is best-effort.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN
      - name: Stage package contents
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/wayfinder.exe dist/
          Copy-Item -Recurse -Force assets/guides dist/guides
      - name: Pack (full + delta, if a previous release was found)
        run: vpk pack -u Wayfinder -v $env:APP_VERSION -p dist -e wayfinder.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --publish --tag $env:TAG
      - name: Set release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-pc-windows-msvc.zip -o cliff.zip
          Expand-Archive cliff.zip -DestinationPath $env:RUNNER_TEMP\git-cliff
          $cliffExe = (Get-ChildItem -Path $env:RUNNER_TEMP\git-cliff -Recurse -Filter git-cliff.exe | Select-Object -First 1).FullName
          & $cliffExe --config cliff.toml --tag $env:TAG --latest --strip header -o RELEASE_NOTES.md
          gh release edit $env:TAG --notes-file RELEASE_NOTES.md
