name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --lib --verbose
    - name: Selftest (software renderer)
      run: |
        $dir = "$env:TEMP\wf-ci"
        cargo run --release -- --selftest --gpu software --data $dir --exit-after 120
        Get-Content "$dir\wayfinder.log" -ErrorAction SilentlyContinue
        $report = Get-Content "$dir\selftest.txt" -ErrorAction SilentlyContinue
        $report
        # selftest always exits 0; its verdict is the "pass/total" first line
        if (-not $report -or $report[0] -notmatch '^(\d+)/\1$') { exit 1 }
