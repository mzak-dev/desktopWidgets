name = "Drawer"
description = "A pull-out tray of apps, folders and files."
category = "Launchers"
icon = "drawer"
size = [260, 220]
min_size = [120, 60]
max_size = [900, 720]

[params.title]
type = "string"
default = "Drawer"
label = "Title"

[params.folder]
type = "path"
default = ""
label = "Shortcut folder"
help = "Filled in for you. Drop shortcuts into it, or use + on the drawer."

[params.toggle]
type = "enum"
default = "button"
choices = [{ value = "button", label = "The arrow button" }, { value = "header", label = "Click the header" }]
label = "Open and close with"
help = "With the header, the arrow button is hidden."
group = "Header"

[params.show_add]
type = "bool"
default = true
label = "Add (+) button"
group = "Header"

[params.show_count]
type = "bool"
default = true
label = "App count"
help = "\"3 apps\" in the header, when it is wide enough."
group = "Header"

[params.title_align]
type = "enum"
default = "left"
choices = [{ value = "left", label = "Left" }, { value = "icons", label = "Next to the icons" }, { value = "center", label = "Centre" }, { value = "right", label = "Right (icons move left)" }]
label = "Title position"
group = "Header"

[params.header_pad_x]
type = "number"
default = 0
min = 0
max = 40
step = 2
label = "Header padding, sides"
group = "Header"

[params.header_gap]
type = "number"
default = 6
min = 0
max = 40
step = 2
label = "Space between title and icons"
help = "The gap under the header, before the shortcuts."
group = "Header"

[params.font_header]
type = "font"
default = ""
label = "Header font"
help = "Any installed font. Empty uses the widget's text font."
group = "Fonts"

[params.font_body]
type = "font"
default = ""
label = "Shortcut names font"
help = "Any installed font. Empty uses the widget's text font."
group = "Fonts"

[params.icon_size]
type = "number"
default = 36
min = 20
max = 72
step = 2
label = "Icon size"

[state]
collapsed = false
scroll = 0

# collapsing shrinks the window to the header row
[expand]
when = "{state.collapsed}"
height = "44"

[root]
direction = "column"
fill = ["$surface", "$surface-2"]
radius = "$radius-lg"
border = 1
shadow = { blur = 14, dy = 5 }
padding = [8, 10]
gap = "{param.header_gap}"
clip = true

  [[root.children]]
  direction = "{param.title_align == 'right' ? 'row-reverse' : 'row'}"
  align = "center"
  gap = 4
  height = 28
  padding = [0, "{param.header_pad_x}"]
  shrink = 0
  on_click = "{param.toggle == 'header' ? 'toggle collapsed' : ''}"

    [[root.children.children]]
    type = "text"
    text = "{param.title}"
    font = "{param.font_header != '' ? param.font_header : '$font-body'}"
    size = 13
    weight = 700
    color = "$text"
    grow = 1
    padding = [0, 6]
    text_align = "{param.title_align == 'center' ? 'center' : param.title_align == 'icons' || param.title_align == 'right' ? 'right' : 'left'}"

    [[root.children.children]]
    type = "text"
    when = "{param.show_count && self.w >= 280 && shortcuts.count > 0}"
    text = "{shortcuts.count} apps"
    font = "{param.font_header != '' ? param.font_header : '$font-body'}"
    size = 11
    color = "$text-dim"
    padding = [0, 4]

    [[root.children.children]]
    when = "{param.show_add}"
    width = 28
    height = 28
    radius = 14
    align = "center"
    justify = "center"
    on_click = "add_app"
    hover = { fill = "$surface-hover" }
    transition = 120
      [[root.children.children.children]]
      type = "text"
      text = "$glyph-add"
      font = "$font-glyph"
      size = 13
      color = "$text-dim"

    [[root.children.children]]
    width = 28
    height = 28
    radius = 14
    align = "center"
    justify = "center"
    when = "{param.toggle == 'button'}"
    on_click = "toggle collapsed"
    hover = { fill = "$surface-hover" }
    transition = 120
      [[root.children.children.children]]
      when = "{state.collapsed}"
      type = "text"
      text = "$glyph-chevron-right"
      font = "$font-glyph"
      size = 13
      color = "$text-dim"

      [[root.children.children.children]]
      when = "{!state.collapsed}"
      type = "text"
      text = "$glyph-chevron-down"
      font = "$font-glyph"
      size = 13
      color = "$text-dim"

  [[root.children]]
  when = "{!state.collapsed}"
  grow = 1
  direction = "row"
  wrap = true
  gap = 6
  align = "start"
  scroll = "{state.scroll}"
  hit = true

    [[root.children.children]]
    type = "text"
    when = "{shortcuts.count == 0}"
    text = "Empty. Press + to add an app."
    size = 12
    color = "$text-dim"
    padding = 6

    [[root.children.children]]
    type = "repeat"
    for = "{shortcuts.items}"
      [[root.children.children.children]]
      direction = "column"
      align = "center"
      gap = 4
      padding = 6
      width = "{self.w >= 200 ? param.icon_size + 30 : param.icon_size + 12}"
      radius = "$radius-sm"
      on_click = "launch {item.target}"
      hover = { fill = "$surface-hover" }
      transition = 140
      enter = { ms = 240, dy = 8, stagger = 24 }
        [[root.children.children.children.children]]
        width = 16
        height = 16
        radius = 8
        position = "absolute"
        top = 2
        right = 2
        align = "center"
        justify = "center"
        on_click = "remove_app {item.target}"
        fill = "$surface-hover"
        opacity = 0.7
        hover = { fill = "$danger", opacity = 1 }
        transition = 120
          [[root.children.children.children.children.children]]
          type = "text"
          text = "$glyph-close"
          font = "$font-glyph"
          size = 8
          color = "$text"

        [[root.children.children.children.children]]
        type = "image"
        src = "{item.icon_id}"
        width = "{param.icon_size}"
        height = "{param.icon_size}"

        [[root.children.children.children.children]]
        type = "text"
        when = "{self.w >= 200}"
        text = "{item.name}"
        font = "{param.font_body != '' ? param.font_body : '$font-body'}"
        size = 11
        color = "$text"
        text_align = "center"
        text_wrap = true
