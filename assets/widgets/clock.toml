name = "Analog Clock"
description = "A classic round clock face that scales with its window."
size = [220, 220]
min_size = [96, 96]
max_size = [520, 520]

[params.ticks]
type = "bool"
default = true
label = "Tick marks"

[params.show_seconds]
type = "bool"
default = true
label = "Second hand"

[params.smooth_seconds]
type = "bool"
default = false
label = "Smooth second hand"
help = "Redraws every frame. Costs GPU time; leave off and the desktop stays idle between ticks."

[root]
fill = ["$surface", "$surface-2"]
radius = "$radius-lg"
border = 1
shadow = { blur = 16, dy = 5 }

  # the face is a true circle even when the window is not square
  [[root.children]]
  inset = 0
  align = "center"
  justify = "center"
    [[root.children.children]]
    width = "{min(self.w, self.h) * 0.9}"
    height = "{min(self.w, self.h) * 0.9}"
    radius = 9999
    fill = "$face"
    border = 1

  [[root.children]]
  type = "ticks"
  when = "{param.ticks && min(self.w, self.h) > 100}"
  count = 60
  major_every = 5
  tick_inset = "{min(self.w, self.h) * 0.075}"
  tick_length = "{min(self.w, self.h) * 0.022}"
  major_length = "{min(self.w, self.h) * 0.045}"
  tick_width = "{max(0.6, min(self.w, self.h) * 0.0055)}"
  major_width = "{max(1.2, min(self.w, self.h) * 0.011)}"

  [[root.children]]
  type = "hand"
  angle = "{clock.hour_angle}"
  length = 0.5
  tail = 0.1
  stroke = "{max(2.5, min(self.w, self.h) * 0.026)}"

  [[root.children]]
  type = "hand"
  angle = "{clock.minute_angle}"
  length = 0.76
  tail = 0.1
  stroke = "{max(1.8, min(self.w, self.h) * 0.017)}"

  [[root.children]]
  type = "hand"
  when = "{param.show_seconds}"
  angle = "{param.smooth_seconds ? clock.second_smooth : clock.second_angle}"
  length = 0.86
  tail = 0.16
  stroke = "{max(1, min(self.w, self.h) * 0.008)}"
  color = "$accent"

  [[root.children]]
  inset = 0
  align = "center"
  justify = "center"
    [[root.children.children]]
    width = "{max(5, min(self.w, self.h) * 0.045)}"
    height = "{max(5, min(self.w, self.h) * 0.045)}"
    radius = 9999
    fill = "$accent"
