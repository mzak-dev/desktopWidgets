needs = ["gallery"]
name = "Photo Gallery"
description = "Browse a folder of photos (JPEG, PNG, WebP, GIF, BMP). Scroll the grid, click a photo to open it with previous / next and a filmstrip. Drop a folder, or a photo from it, on the card to show that folder."
category = "Photos"
icon = "image"
size = [480, 360]
min_size = [220, 160]
max_size = [900, 800]

[params.folder]
type = "folder"
default = ""
label = "Photo folder"
help = "Dropping a folder, or a photo in it, on the card sets it. The grid follows the folder as files come and go."

[params.thumb_size]
type = "number"
default = 100
min = 48
max = 180
step = 4
label = "Thumbnail size"

[params.gap]
type = "number"
default = 6
min = 0
max = 16
step = 1
label = "Gap"

[params.fill]
type = "enum"
choices = [{ value = "cover", label = "Crop to squares" }, { value = "contain", label = "Show whole photo" }]
default = "cover"
label = "Thumbnails"

[params.sort]
type = "enum"
choices = [{ value = "name", label = "Name" }, { value = "newest", label = "Newest first" }, { value = "oldest", label = "Oldest first" }]
default = "name"
label = "Order"

[params.show_names]
type = "bool"
default = false
label = "Show file names"

[state]
scroll = 0
scroll_x = 0
index = -1

[root]
direction = "column"
fill = ["$surface", "$surface-2"]
radius = "$radius-lg"
border = 1
shadow = { blur = 14, dy = 5 }
padding = 10
gap = 8
clip = true
on_drop = "gallery.drop"

  [[root.children]]
  type = "text"
  when = "{gallery.folder == ''}"
  text = "Drop a photo folder here, or choose one in Settings."
  text_wrap = true
  size = 13
  color = "$text-dim"
  padding = 8

  [[root.children]]
  type = "text"
  when = "{gallery.error != ''}"
  text = "{gallery.error}"
  text_wrap = true
  size = 13
  color = "$text-dim"
  padding = 8

  [[root.children]]
  type = "text"
  when = "{gallery.folder != '' && gallery.count == 0 && gallery.error == ''}"
  text = "No photos in this folder."
  size = 13
  color = "$text-dim"
  padding = 8

  # ---- grid: nothing open ----
  [[root.children]]
  when = "{gallery.count > 0 && state.index < 0}"
  grow = 1
  direction = "row"
  wrap = true
  align = "start"
  gap = "{param.gap}"
  scroll = "{state.scroll}"
  hit = true
    [[root.children.children]]
    type = "repeat"
    for = "{gallery.items}"
    as = "p"
      [[root.children.children.children]]
      direction = "column"
      align = "center"
      gap = 3
      width = "{param.thumb_size}"
      radius = "$radius-sm"
      on_click = "set index {index}"
      hover = { fill = "$surface-hover" }
      transition = 140
      enter = { ms = 220, dy = 6, stagger = "{min(12, 500 / max(gallery.count, 1))}" }
        [[root.children.children.children.children]]
        type = "image"
        src = "file:{p.path}"
        max = 256
        fit = "{param.fill}"
        width = "{param.thumb_size}"
        height = "{param.thumb_size}"
        radius = "$radius-sm"
        [[root.children.children.children.children]]
        when = "{param.show_names}"
        type = "text"
        text = "{p.name}"
        size = 10
        color = "$text-dim"
        text_align = "center"

  # ---- viewer: the photo, then a filmstrip you can scroll sideways ----
  [[root.children]]
  when = "{gallery.count > 0 && state.index >= 0}"
  min_height = 0
  grow = 1
  direction = "column"
  gap = 8

    # top bar: back to the grid, name, previous / next
    [[root.children.children]]
    direction = "row"
    align = "center"
    gap = 4
      [[root.children.children.children]]
      width = 34
      height = 32
      align = "center"
      justify = "center"
      radius = "$radius-sm"
      on_click = "set index -1"
      hover = { fill = "$surface-hover" }
      transition = 140
        [[root.children.children.children.children]]
        type = "text"
        text = "$glyph-grid"
        font = "$font-glyph"
        size = 16
        color = "$accent"
      [[root.children.children.children]]
      type = "text"
      text = "{at(gallery.items, state.index).name}"
      size = 12
      color = "$text-dim"
      grow = 1
      min_width = 0
      text_align = "center"
      [[root.children.children.children]]
      width = 34
      height = 32
      align = "center"
      justify = "center"
      radius = "$radius-sm"
      on_click = "set index {clamp(state.index - 1, 0, gallery.count - 1)}"
      hover = { fill = "$surface-hover" }
      transition = 140
        [[root.children.children.children.children]]
        type = "text"
        text = "$glyph-chevron-left"
        font = "$font-glyph"
        size = 16
        color = "$text"
      [[root.children.children.children]]
      width = 34
      height = 32
      align = "center"
      justify = "center"
      radius = "$radius-sm"
      on_click = "set index {clamp(state.index + 1, 0, gallery.count - 1)}"
      hover = { fill = "$surface-hover" }
      transition = 140
        [[root.children.children.children.children]]
        type = "text"
        text = "$glyph-chevron-right"
        font = "$font-glyph"
        size = 16
        color = "$text"

    # the photo itself, crossfading from the last one; click it for the next, round to the
    # first. min_height 0 lets it shrink to fit.
    [[root.children.children]]
    min_height = 0
    grow = 1
    direction = "column"
    align = "center"
    justify = "center"
    clip = true
    on_click = "set index {(state.index + 1) % gallery.count}"
      [[root.children.children.children]]
      type = "image"
      src = "file:{at(gallery.items, state.index).path}"
      max = 2048
      fade = 250
      width = "100%"
      height = "100%"
      radius = "$radius-sm"

    # filmstrip
    [[root.children.children]]
    height = "{param.thumb_size * 0.6}"
    shrink = 0
    direction = "row"
    gap = 4
    scroll_x = "{state.scroll_x}"
    hit = true
      [[root.children.children.children]]
      type = "repeat"
      for = "{gallery.items}"
      as = "p"
        [[root.children.children.children.children]]
        type = "image"
        src = "file:{p.path}"
        max = 256
        fit = "cover"
        width = "{param.thumb_size * 0.6}"
        height = "{param.thumb_size * 0.6}"
        shrink = 0
        radius = "$radius-sm"
        opacity = "{index == state.index ? 1 : 0.55}"
        on_click = "set index {index}"
        hover = { fill = "$surface-hover" }
        transition = 140

  # more photos than a desktop grid should hold
  [[root.children]]
  when = "{gallery.truncated && state.index < 0}"
  type = "text"
  text = "Showing the first {gallery.count} photos."
  size = 10
  color = "$text-dim"
