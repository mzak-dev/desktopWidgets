needs = ["gallery"]
name = "Photo Gallery"
description = "Browse a folder of photos (JPEG, PNG, WebP, GIF, BMP). Small, it is a grid; wider, the folder's name and count on top; large, names under the photos, and an open photo gets a filmstrip and its date and size. Drop a folder, or a photo from it, on the card to show that folder."
category = "Photos"
icon = "image"
size = [360, 340]
min_size = [170, 150]
max_size = [900, 800]

[params.folder]
type = "folder"
default = ""
label = "Photo folder"
help = "Dropping a folder, or a photo in it, on the card sets it. The grid follows the folder as files come and go."

[params.thumb_size]
type = "number"
default = 100
min = 48
max = 180
step = 4
label = "Thumbnail size"

[params.gap]
type = "number"
default = 6
min = 0
max = 16
step = 1
label = "Gap"

[params.fill]
type = "enum"
choices = [{ value = "cover", label = "Crop to squares" }, { value = "contain", label = "Show whole photo" }]
default = "cover"
label = "Thumbnails"

[params.sort]
type = "enum"
choices = [{ value = "name", label = "Name" }, { value = "newest", label = "Newest first" }, { value = "oldest", label = "Oldest first" }]
default = "name"
label = "Order"

[params.show_names]
type = "bool"
default = false
label = "Show file names"
help = "A large gallery shows them anyway."

[state]
scroll = 0
scroll_x = 0
index = -1

# Sizes, as on macOS, with the same breakpoints in every media, photo and agent widget:
#   small   under 260 wide        a grid of two columns, nothing else
# The thumbnails stretch to fill the width: as many columns of about `thumb_size` as fit.
#   medium  260+ wide             the folder's name and how many photos, over the grid
#   large   260+ wide and high    names under the photos; an open photo gets a filmstrip
#                                 and a line with its date, size and place in the folder
[root]
direction = "column"
fill = ["$surface", "$surface-2"]
radius = "$radius-lg"
border = 1
shadow = { blur = 14, dy = 5 }
padding = "{self.w < 260 ? 12 : 16}"
gap = 10
clip = true
on_drop = "gallery.drop"

  # ================= nothing to show: the picture glyph and why =================
  [[root.children]]
  when = "{gallery.count == 0}"
  grow = 1
  direction = "column"
  align = "center"
  justify = "center"
  gap = 6
    [[root.children.children]]
    type = "text"
    text = "$glyph-image"
    font = "$font-glyph"
    size = 26
    color = "$text-dim"
    [[root.children.children]]
    type = "text"
    text = "{gallery.error != '' ? gallery.error : (gallery.folder == '' ? 'Drop a photo folder here, or choose one in Settings.' : 'No photos in this folder.')}"
    text_wrap = true
    text_align = "center"
    size = 12
    color = "$text-dim"

  # ================= the grid =================
  # medium and up: which folder, how many
  [[root.children]]
  when = "{gallery.count > 0 && state.index < 0 && self.w >= 260 && self.h >= 180}"
  direction = "row"
  align = "end"
  gap = 8
    [[root.children.children]]
    grow = 1
    min_width = 0
    type = "text"
    text = "{gallery.folder_name}"
    size = 14
    weight = 600
    color = "$text"
    [[root.children.children]]
    type = "text"
    text = "{gallery.truncated ? 'first ' : ''}{gallery.count} {gallery.count == 1 ? 'photo' : 'photos'}"
    size = 11
    color = "$text-dim"

  [[root.children]]
  when = "{gallery.count > 0 && state.index < 0}"
  grow = 1
  min_height = 0
  direction = "row"
  wrap = true
  align = "start"
  gap = "{param.gap}"
  scroll = "{state.scroll}"
  hit = true
    [[root.children.children]]
    type = "repeat"
    for = "{gallery.items}"
    as = "p"
      [[root.children.children.children]]
      direction = "column"
      align = "center"
      gap = 3
      width = "{floor(((self.w - (self.w < 260 ? 24 : 32)) - param.gap * (max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))) - 1)) / max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))))}"
      radius = "$radius-sm"
      on_click = "set index {index}"
      hover = { opacity = 0.85 }
      transition = 140
      enter = { ms = 220, dy = 6, stagger = "{min(12, 500 / max(gallery.count, 1))}" }
        [[root.children.children.children.children]]
        type = "image"
        src = "file:{p.path}"
        max = 256
        fit = "{param.fill}"
        width = "{floor(((self.w - (self.w < 260 ? 24 : 32)) - param.gap * (max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))) - 1)) / max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))))}"
        height = "{floor(((self.w - (self.w < 260 ? 24 : 32)) - param.gap * (max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))) - 1)) / max(2, round(((self.w - (self.w < 260 ? 24 : 32)) + param.gap) / (param.thumb_size + param.gap))))}"
        radius = "$radius-sm"
        [[root.children.children.children.children]]
        when = "{(param.show_names || (self.w >= 260 && self.h >= 260))}"
        type = "text"
        text = "{p.name}"
        size = 10
        color = "$text-dim"
        text_align = "center"

  # ================= one photo, opened =================
  # top bar: back to the grid, the name, previous / next
  [[root.children]]
  when = "{gallery.count > 0 && state.index >= 0}"
  direction = "row"
  align = "center"
  gap = 2
    [[root.children.children]]
    width = 30
    height = 30
    radius = 99
    align = "center"
    justify = "center"
    on_click = "set index -1"
    hover = { fill = "$surface-hover" }
    transition = 140
      [[root.children.children.children]]
      type = "text"
      text = "$glyph-grid"
      font = "$font-glyph"
      size = 14
      color = "$accent"
    [[root.children.children]]
    type = "text"
    text = "{at(gallery.items, state.index).name}"
    size = 13
    weight = 600
    color = "$text"
    grow = 1
    min_width = 0
    text_align = "center"
    [[root.children.children]]
    width = 30
    height = 30
    radius = 99
    align = "center"
    justify = "center"
    on_click = "set index {clamp(state.index - 1, 0, gallery.count - 1)}"
    hover = { fill = "$surface-hover" }
    transition = 140
      [[root.children.children.children]]
      type = "text"
      text = "$glyph-chevron-left"
      font = "$font-glyph"
      size = 14
      color = "$text"
    [[root.children.children]]
    width = 30
    height = 30
    radius = 99
    align = "center"
    justify = "center"
    on_click = "set index {clamp(state.index + 1, 0, gallery.count - 1)}"
    hover = { fill = "$surface-hover" }
    transition = 140
      [[root.children.children.children]]
      type = "text"
      text = "$glyph-chevron-right"
      font = "$font-glyph"
      size = 14
      color = "$text"

  # the photo, crossfading from the last one; click it for the next, round to the first
  [[root.children]]
  when = "{gallery.count > 0 && state.index >= 0}"
  min_height = 0
  grow = 1
  direction = "column"
  align = "center"
  justify = "center"
  clip = true
  on_click = "set index {(state.index + 1) % gallery.count}"
    [[root.children.children]]
    type = "image"
    src = "file:{at(gallery.items, state.index).path}"
    max = 2048
    fade = 250
    width = "100%"
    height = "100%"
    radius = "$radius-sm"

  # large: when it was taken, how big, which of how many
  [[root.children]]
  when = "{gallery.count > 0 && state.index >= 0 && self.w >= 260 && self.h >= 260}"
  type = "text"
  text = "{at(gallery.items, state.index).date}{at(gallery.items, state.index).date != '' ? '  ·  ' : ''}{at(gallery.items, state.index).size >= 1048576 ? round(at(gallery.items, state.index).size / 104857.6) / 10 : round(at(gallery.items, state.index).size / 1024)} {at(gallery.items, state.index).size >= 1048576 ? 'MB' : 'KB'}  ·  {state.index + 1} of {gallery.count}"
  size = 11
  color = "$text-dim"
  text_align = "center"

  # large: a filmstrip you can scroll sideways
  [[root.children]]
  when = "{gallery.count > 0 && state.index >= 0 && self.h >= 260}"
  height = "{param.thumb_size * 0.5}"
  shrink = 0
  direction = "row"
  gap = 4
  scroll_x = "{state.scroll_x}"
  hit = true
    [[root.children.children]]
    type = "repeat"
    for = "{gallery.items}"
    as = "p"
      [[root.children.children.children]]
      type = "image"
      src = "file:{p.path}"
      max = 256
      fit = "cover"
      width = "{param.thumb_size * 0.5}"
      height = "{param.thumb_size * 0.5}"
      shrink = 0
      radius = 6
      opacity = "{index == state.index ? 1 : 0.5}"
      on_click = "set index {index}"
      hover = { opacity = 1 }
      transition = 140
