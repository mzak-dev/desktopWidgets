format = 1
name = "icon_folder lays out cleanly at every size it allows"

[widget]
id = "icon_folder"
items = "demo"

# scale 1 and the widest realistic clock text: what the engine's own fit checks used
[look]
scale = 1

[env]
now = 2026-09-23T23:58:58

[expect]
flags = "error"
# OVERFLOW is not an error here: at its smallest heights the tile is 7 px taller than the card
# (padding only, the card clips it), and no text or shape sticks out
allow = ["OVERFLOW-X", "OVERFLOW-Y"]

# the default size, then a 4x4 grid from the smallest size to the largest, each with the
# defaults and with every switch on
[sweep]
sizes = "grid:4x4"

[sweep.variants]
defaults = {}
all_on = { params = "bools:true" }
