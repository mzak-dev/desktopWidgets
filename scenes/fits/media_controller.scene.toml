format = 1
name = "media_controller lays out cleanly at every size it allows"

[widget]
id = "media_controller"

# scale 1 and the widest realistic clock text: what the engine's own fit checks used
[look]
scale = 1

[env]
now = 2026-09-23T23:58:58

[expect]
flags = "error"
# the widget clips its rows (`clip = true`): at the narrowest card a row is laid out wider than
# the card and clipped by design, which only these layout flags see (added when main's media
# widgets were merged; worth a look at the 170 px column)
allow = ["OVERFLOW-X", "OVERFLOW-Y", "OUTSIDE"]

# the default size, then a 4x4 grid from the smallest size to the largest, each with the
# defaults and with every switch on
[sweep]
sizes = "grid:4x4"

[sweep.variants]
defaults = {}
all_on = { params = "bools:true" }
