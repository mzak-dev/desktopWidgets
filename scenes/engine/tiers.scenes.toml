format = 1
# The sizes where a widget's content changes (what examples/render_widgets.rs drew with `tiers`),
# and the one built-in at its largest size the other engine scenes do not reach. Dumps only:
# `wayfinder scene sheet engine/tiers` draws them on one sheet.

[defaults]
tags = ["engine"]

[defaults.widget]
items = "demo"

[defaults.env.sys]
cpu = 42

[defaults.expect]
flags = "error"
# some modules reach a pixel past their slot at some sizes (fractional layout): see scenes/fits
allow = ["OVERFLOW-X", "OVERFLOW-Y", "OUTSIDE"]

[[scene]]
name = "clock-180"
[scene.widget]
id = "clock"
size = "180x180"

[[scene]]
name = "clock-330x400"
[scene.widget]
id = "clock"
size = "330x400"

