format = 1
# The pixel tolerances of `wayfinder scene diff` (tooling, not frozen). Placeholders until
# `scene selfcheck` has measured them. A scene may tighten these in a [scene."<id or glob>"]
# table, never loosen them.
#
# threshold: a pixel fails when its YIQ distance to the baseline's is above this (0.6 is about
#   one grey level). failed_pixels: allowed failures when the environment fingerprint (fonts,
#   adapter, Windows build, engine crates) matches the baseline's. failed_percent: allowed
#   failures, in percent of all pixels, when it does not.

[pixels]
threshold = 0.6
failed_pixels = 0
failed_percent = 0.02
