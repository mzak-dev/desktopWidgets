# Raywright's settings for these tests (see docs/development.md).
timeout = "10s"
expect_timeout = "10s"
# Widgets sit on the desktop and take no focus: OS input reaches them as a real mouse would.
input_mode = "os"
trace = "retain-on-failure"

# Stored pictures show the system's own icons (Notepad, Calculator, Explorer, Terminal), which
# differ a little between Windows images on GitHub's runners (a run with 0.54% of the folder's
# pixels different failed a 0.2% limit). 2% still fails on a moved or resized widget, another
# colour, or a missing element: those change far more of the picture.
[snapshot]
max_diff_ratio = 0.02

# The same profile the Claude Code MCP server (.mcp.json) uses to start Wayfinder.
[profiles.wayfinder]
exe = "../target/debug/wayfinder.exe"
args = ["--automation", "--gpu", "software"]
temp_data_dir = "--data"
bridge = true
ready = { windows = 4, bridge = true }
